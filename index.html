<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL CGPA Calculator</title>
<style>
body{font-family:Arial;background:#e3f2fd;padding:12px;margin:0}
.box{max-width:420px;margin:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 15px #0002}
h1{text-align:center;color:#0072CE;font-size:22px;margin:5px}
.sub{text-align:center;color:green;font-size:13px;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:13px;background:#0072CE;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:8px}
#res{margin-top:12px;padding:12px;background:#e8f5e9;border-radius:10px;text-align:center;display:none}
</style></head><body>
<div class="box">
<h1>🇸🇱 SL CGPA Calculator</h1>
<div class="sub">IMATT | IPAM | FBC | MMTU | EBK | UNIMAK | COMAHS</div>
<input id="name" placeholder="Student Name">
<input id="sid" placeholder="ID Number">
<select id="uni"><option>IMATT</option><option>IPAM</option><option>FBC</option><option>MMTU</option><option>EBKUST</option><option>UNIMAK</option></select>
<select id="scale"><option value="4">4.0 Scale - IMATT, IPAM, FBC, UNIMAK</option><option value="5">5.0 Scale - MMTU, EBK</option></select>
<input type="number" id="num" placeholder="How many modules?" min="1">
<button onclick="make()">Next - Enter Grades</button>
<div id="grades"></div>
<button id="cbtn" style="display:none" onclick="calc()">Calculate CGPA</button>
<div id="res"></div>
<p style="text-align:center;font-size:11px;color:gray">Built by Issa Koroma - IMATT Computer Science</p>
</div>
<script>
const m4={"A":4,"B+":3.5,"B":3,"B-":2.5,"C+":2,"C":1.5,"C-":1,"D":0.5,"F":0};
const m5={"A":5,"B+":4.5,"B":4,"B-":3.5,"C+":3,"C":2.5,"C-":2,"D":1,"F":0};
function make(){let n=document.getElementById("num").value;if(!n)return alert("Enter number");let h="";for(let i=1;i<=n;i++)h+=`<input placeholder="Module ${i} Grade: A, B+, B, C..." id="g${i}" style="margin:4px 0">`;document.getElementById("grades").innerHTML=h;document.getElementById("cbtn").style.display="block";}
function calc(){let s=document.getElementById("scale").value;let map=s=="4"?m4:m5;let n=document.getElementById("num").value;let t=0,v=0;for(let i=1;i<=n;i++){let g=document.getElementById("g"+i).value.toUpperCase().trim();if(map[g]!=null){t+=map[g];v++;}}if(!v)return alert("Enter A, B+, B etc");let cg=t/v;let cl="";if(s=="4"){if(cg>=3.6)cl="First Class";else if(cg>=3.0)cl="Second Class Upper (2:1)";else if(cg>=2.5)cl="Second Class Lower (2:2)";else if(cg>=2.0)cl="Third Class";else if(cg>=1.0)cl="Pass";else cl="Fail";}else{if(cg>=4.5)cl="First Class";else if(cg>=3.5)cl="Second Class Upper";else if(cg>=2.5)cl="Second Class Lower";else if(cg>=1.5)cl="Third Class";else cl="Fail";}let d=document.getElementById("res");d.style.display="block";d.innerHTML=`<h2 style="margin:0">CGPA: ${cg.toFixed(2)} / ${s}.0</h2><b>${cl}</b><br>${document.getElementById("name").value}`;}
</script></body></html>
